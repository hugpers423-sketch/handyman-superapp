name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/handyman-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/handyman-superapp

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (backend)
        run: |
          cd handyman-backend
          npm ci

      - name: Install dependencies (frontend)
        run: |
          cd handyman-superapp
          npm ci

      - name: TypeScript check (backend)
        run: |
          cd handyman-backend
          npm run build

      - name: TypeScript check (frontend)
        run: |
          cd handyman-superapp
          npm run build

      - name: ESLint (backend)
        run: |
          cd handyman-backend
          npx eslint src --ext .ts

      - name: ESLint (frontend)
        run: |
          cd handyman-superapp
          npx eslint src --ext .ts,.tsx

  # ============================================
  # TESTS
  # ============================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handyman
          POSTGRES_PASSWORD: handyman
          POSTGRES_DB: handyman_test
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U handyman -d handyman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (backend)
        run: |
          cd handyman-backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd handyman-backend
          npx prisma generate

      - name: Run migrations
        run: |
          cd handyman-backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://handyman:handyman@localhost:5432/handyman_test?schema=public

      - name: Run tests (backend)
        run: |
          cd handyman-backend
          npm run test
        env:
          DATABASE_URL: postgresql://handyman:handyman@localhost:5432/handyman_test?schema=public
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-testing-only-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-only-32-chars

      - name: Install dependencies (frontend)
        run: |
          cd handyman-superapp
          npm ci

      - name: Run tests (frontend)
        run: |
          cd handyman-superapp
          npm run test:run

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./handyman-backend/coverage/lcov.info,./handyman-superapp/coverage/lcov.info

  # ============================================
  # BUILD DOCKER IMAGES
  # ============================================
  build:
    name: Build Docker Images
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (backend)
        uses: docker/build-push-action@v5
        with:
          context: ./handyman-backend
          file: ./handyman-backend/Dockerfile.prod
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            GIT_COMMIT=${{ github.sha }}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./handyman-superapp
          file: ./handyman-superapp/Dockerfile.prod
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY STAGING
  # ============================================
  deploy-staging:
    name: Deploy Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/handyman
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health Check
        run: |
          sleep 30
          curl -f https://staging.handy.man/health || exit 1
          curl -f https://staging.handy.man/api/health || exit 1

  # ============================================
  # DEPLOY PRODUCTION
  # ============================================
  deploy-production:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/handyman
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health Check
        run: |
          sleep 30
          curl -f https://handy.man/health || exit 1
          curl -f https://handy.man/api/health || exit 1

      - name: Notify
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: |
            🚀 *Handyman Super App* deployed to ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}