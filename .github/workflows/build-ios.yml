name: Build 3 iOS Apps (IPA) for App Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client-ios:
    name: Build Cliente iOS (IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: handyman-superapp/package-lock.json

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies
        run: |
          cd handyman-superapp
          npm ci

      - name: Build web assets (Cliente)
        run: |
          cd handyman-superapp
          npm run build:client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sync Capacitor iOS (Cliente)
        run: |
          cd handyman-superapp
          npx cap sync ios --config capacitor.config.client.ts

      - name: Install CocoaPods
        run: |
          cd handyman-superapp/ios/App
          pod install --repo-update

      - name: Build iOS (Cliente)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPMENT_TEAM }} \
            PROVISIONING_PROFILE_SPECIFIER=${{ secrets.IOS_PROVISIONING_PROFILE_CLIENT }}

      - name: Export IPA (Cliente)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload Cliente IPA
        uses: actions/upload-artifact@v4
        with:
          name: cliente-ios
          path: handyman-superapp/ios/App/build/App.ipa
          retention-days: 30

  build-pro-ios:
    name: Build Pro iOS (IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: handyman-superapp/package-lock.json

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies
        run: |
          cd handyman-superapp
          npm ci

      - name: Build web assets (Pro)
        run: |
          cd handyman-superapp
          npm run build:pro
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sync Capacitor iOS (Pro)
        run: |
          cd handyman-superapp
          npx cap sync ios --config capacitor.config.pro.ts

      - name: Install CocoaPods
        run: |
          cd handyman-superapp/ios/App
          pod install --repo-update

      - name: Build iOS (Pro)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPMENT_TEAM }} \
            PROVISIONING_PROFILE_SPECIFIER=${{ secrets.IOS_PROVISIONING_PROFILE_PRO }}

      - name: Export IPA (Pro)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: pro-ios
          path: handyman-superapp/ios/App/build/App.ipa
          retention-days: 30

  build-staff-ios:
    name: Build Staff iOS (IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: handyman-superapp/package-lock.json

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies
        run: |
          cd handyman-superapp
          npm ci

      - name: Build web assets (Staff)
        run: |
          cd handyman-superapp
          npm run build:staff
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sync Capacitor iOS (Staff)
        run: |
          cd handyman-superapp
          npx cap sync ios --config capacitor.config.staff.ts

      - name: Install CocoaPods
        run: |
          cd handyman-superapp/ios/App
          pod install --repo-update

      - name: Build iOS (Staff)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPMENT_TEAM }} \
            PROVISIONING_PROFILE_SPECIFIER=${{ secrets.IOS_PROVISIONING_PROFILE_STAFF }}

      - name: Export IPA (Staff)
        run: |
          cd handyman-superapp/ios/App
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload Staff IPA
        uses: actions/upload-artifact@v4
        with:
          name: staff-ios
          path: handyman-superapp/ios/App/build/App.ipa
          retention-days: 30

  create-ios-release:
    name: Create iOS Release
    needs: [build-client-ios, build-pro-ios, build-staff-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Cliente iOS
        uses: actions/download-artifact@v4
        with:
          name: cliente-ios
          path: artifacts/cliente

      - name: Download Pro iOS
        uses: actions/download-artifact@v4
        with:
          name: pro-ios
          path: artifacts/pro

      - name: Download Staff iOS
        uses: actions/download-artifact@v4
        with:
          name: staff-ios
          path: artifacts/staff

      - name: Create iOS Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/cliente/*.ipa
            artifacts/pro/*.ipa
            artifacts/staff/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "Handyman iOS v${{ github.ref_name }} - 3 IPAs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}